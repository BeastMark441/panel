name: Release

on:
  workflow_dispatch:
    inputs:
      pterodactyl_version:
        description: "Версия Pterodactyl без v, например 2.0.0-beta.2"
        required: true
        type: string
      translation_version:
        description: "Версия перевода без v: 2.0.0-beta.2.ru.1 или 2.0.0.ru.1"
        required: true
        type: string

jobs:
  install:
    uses: ./.github/workflows/install.yaml
    permissions:
      contents: read

  release:
    name: Release
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PTERODACTYL_VERSION: ${{ inputs.pterodactyl_version }}
      TRANSLATION_VERSION: ${{ inputs.translation_version }}

    steps:
      - uses: actions/checkout@v7

      - name: Validate versions and release refs
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'
          TRANSLATION_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?\.ru\.[1-9][0-9]*$'

          if [[ ! "$PTERODACTYL_VERSION" =~ $UPSTREAM_PATTERN ]]; then
            echo "::error::Invalid Pterodactyl version: $PTERODACTYL_VERSION"
            exit 1
          fi

          if [[ ! "$TRANSLATION_VERSION" =~ $TRANSLATION_PATTERN ]]; then
            echo "::error::Invalid translation version: $TRANSLATION_VERSION"
            exit 1
          fi

          if [[ "${TRANSLATION_VERSION%.ru.*}" != "$PTERODACTYL_VERSION" ]]; then
            echo "::error::Translation version must use the specified Pterodactyl version"
            exit 1
          fi

          git fetch origin --tags

          if git show-ref --verify --quiet "refs/tags/v$TRANSLATION_VERSION"; then
            echo "::error::Release tag already exists"
            exit 1
          fi

          if [[ -n "$(git ls-remote --heads origin "release/v$TRANSLATION_VERSION")" ]]; then
            echo "::error::Release branch already exists"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Write both versions
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("config/app.php")
          text = path.read_text()

          for key, variable in [
              ("version", "PTERODACTYL_VERSION"),
              ("translation_version", "TRANSLATION_VERSION"),
          ]:
              pattern = rf"(?m)^    '{key}' => '[^']*',$"
              replacement = f"    '{key}' => '{os.environ[variable]}',"
              text, count = re.subn(pattern, lambda _: replacement, text)

              if count != 1:
                  raise SystemExit(f"Expected exactly one config field: {key}")

          path.write_text(text)
          PY

      - run: npm ci
      - run: npm run tsc
      - run: npm run build:production

      - name: Commit and tag release
        shell: bash
        run: |
          set -euo pipefail

          TAG="v$TRANSLATION_VERSION"
          BRANCH="release/$TAG"

          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --local user.name 'github-actions[bot]'

          git checkout -b "$BRANCH"
          git add config/app.php
          git commit -m "ci(release): translation $TRANSLATION_VERSION, Pterodactyl $PTERODACTYL_VERSION"
          git tag "$TAG"

          git push --atomic origin \
            "HEAD:refs/heads/$BRANCH" \
            "refs/tags/$TAG"

      - name: Create release archive
        run: bash .github/scripts/archive.sh

      - name: Write release notes
        shell: bash
        run: |
          {
            printf 'Pterodactyl: %s\n' "$PTERODACTYL_VERSION"
            printf 'Перевод: %s\n\n' "$TRANSLATION_VERSION"
            awk -v heading="## v$TRANSLATION_VERSION" '
              $0 == heading { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
          } > RELEASE_CHANGELOG

      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ inputs.translation_version }}
          name: Перевод v${{ inputs.translation_version }}
          draft: true
          prerelease: ${{ contains(inputs.pterodactyl_version, '-alpha.') || contains(inputs.pterodactyl_version, '-beta.') || contains(inputs.pterodactyl_version, '-rc.') }}
          body_path: ./RELEASE_CHANGELOG
          files: |
            panel.tar.gz
